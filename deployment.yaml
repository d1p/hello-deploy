apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
spec:
  replicas: 1
  selector:
    matchLavels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      imagePullSecrets:
        - name: harbor-pull
      containers:
          name: hello
          image: harbor.debashis.xyz/homelab/hello-app
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 128Mi